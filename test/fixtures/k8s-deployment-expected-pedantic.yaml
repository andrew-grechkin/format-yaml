---
apiVersion: v1

data:
  index.html: |
    <html><body><h1>hello</h1></body></html>

kind: ConfigMap

metadata:
  name: nginx-config
...

---
apiVersion: apps/v1
kind: Deployment

metadata:
  labels:
    app: nginx
  name: nginx-deployment

spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - image: nginx:1.14.2
          name: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: config
      volumes:
        - configMap:
            name: nginx-config
          name: config
...

---
apiVersion: v1
kind: Service

metadata:
  name: nginx-service

spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx
  type: ClusterIP
...
