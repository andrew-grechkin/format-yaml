description: |
  ピラ砂丘は、南仏の人気リゾート地、アルカションにある欧州最大の砂丘です。南北約 3000 m、東西約 500 m、標高は
  100 m というこの砂丘を登りきると、白い砂浜の向こうに広がる青いアルカション湾を一望にすることができます。砂丘の頂上まで階段で登ることもできますが、階段は 160 段あります…
  ピラ砂丘を降りて、そのままアルカション湾で海水浴を楽しむこともできますが、帰りはまた砂丘を登らなければなりません。この砂丘は、季節によって頂上の高さが変わり、少しずつ内陸部に移動しています。アルカションは牡蠣の養殖でも有名で、フランスの食用牡蠣の約 70% を生産しています。
